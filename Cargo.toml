[package]
name = "ricefield"
version = "1.0.0-rc.19"
edition = "2024"
description = "A fast, themeable Linux file explorer built in Rust for RiceBowl"
license = "MIT"
repository = "https://github.com/CopyPasteUser/Ricefield"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "accesskit"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
trash = "5.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
libc = "0.2"
libloading = "0.8.9"
zbus = "5.19"
regex = { version = "1.12", default-features = false, features = ["std", "perf", "unicode"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
